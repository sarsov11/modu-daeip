<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개념 — 모두의 국어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/diagram.css?v=1027a">
<style>
:root{--bg:#fff;--ink:#111;--sub:#5b5b5b;--faint:#a3a3a3;--line:#e4e4e4;--soft:#f5f5f3;--green:#0B5E3C;--green-soft:#e3f1e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 "Pretendard Variable",Pretendard,system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top a{color:var(--sub);text-decoration:none;font-weight:700;font-size:14px}
h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.03em}
.tabs{display:flex;gap:8px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.tabs button{border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 16px;font:700 15px/1 inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.grp{margin:26px 0 8px;font-size:15px;color:var(--sub);font-weight:800}
.cc{border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.cc h2{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
.how{margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.how b{display:block;font-size:12.5px;color:var(--sub);margin-bottom:2px}
.dg{--dg-key:var(--green);--dg-key-soft:var(--green-soft);--dg-a:var(--green);--dg-b:#5b5b5b;--dg-line:var(--line);--dg-bg:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 모두의 국어</a></div>
  <h1>개념</h1>
  <div class="tabs"><button type="button" data-k="lit" class="on">문학 개념어</button><button type="button" data-k="gram">어법</button></div>
  <div id="list"></div>
</div>
<script src="js/diagram.js?v=1027a"></script>
<script src="data/concepts.js?v=1027a"></script>
<script>
/* 국어 개념 도식(2026-10-27 대표님 「모든 과목 개념을 도식으로」) — 데이터의 뜻·확인법·예·헷갈림만 쓴다(새 글 없음).
   문학: 함께 구별할 개념이 있으면 뜻끼리 나란히 견주고, 없으면 개념어 상자. 어법: 개념어 상자 + 예. */
(function () {
  var C = window.GK_CONCEPTS || {}, D = window.DIAGRAM;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function 그리기(k) {
    var S = C[k] || { 묶음: [], 개념: [] }, by = {};
    S.개념.forEach(function (c) { by[c.id] = c; });
    var h = "";
    S.묶음.forEach(function (g) {
      var cs = S.개념.filter(function (c) { return c.묶음 === g.id; });
      if (!cs.length) return;
      h += '<div class="grp">' + esc(g.이름) + (g.갈래 && g.갈래 !== "공통" ? " · " + esc(g.갈래) : "") + "</div>";
      cs.forEach(function (c) {
        var 짝 = (c.헷갈림 || []).map(function (id) { return by[id]; }).filter(Boolean).slice(0, 2);
        var 도 = 짝.length
          ? D.html({ t: "vs", title: "함께 구별할 개념", cols: [c].concat(짝).map(function (x) { return { name: x.이름, items: [x.뜻] }; }) })
          : D.html({ t: "def", term: c.이름, text: c.뜻, ex: c.예 || [] });
        h += '<section class="cc" id="' + esc(c.id) + '"><h2>' + esc(c.이름) + "</h2>" + 도 +
          (c.확인법 ? '<div class="how"><b>확인하는 법</b>' + esc(c.확인법) + "</div>" : "") + "</section>";
      });
    });
    document.getElementById("list").innerHTML = h;
  }
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
    그리기(b.getAttribute("data-k")); window.scrollTo(0, 0);
  });
  그리기("lit");
})();
</script>
</body>
</html>

<script src="js/zzstrat.js?v=3247d7fa"></script><script src="js/zzstrat_gukeo.js?v=6e6263ef"></script><script>ZZSTRAT.auto("gukeo");</script>
<script>/* 용어표 9절: 공용 합격전략 엔진의 단추 글자를 「합격 전략」으로(공용 파일은 그대로 둔다) */
(function(){function fix(){document.querySelectorAll(".zs-btn,.zs-fab,#zs,#zsy").forEach(function(e){var w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode()){if(n.parentNode.className==="t"||e.classList.contains("zs-btn")||e.classList.contains("zs-fab")){if(n.nodeValue==="합격전략")n.nodeValue="합격 전략"}}});document.querySelectorAll('[aria-label="합격전략"]').forEach(function(e){e.setAttribute("aria-label","합격 전략")})}
new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true});fix()})();</script>
